name: Release

# Triggered by pushing an annotated tag such as v5.3.0.
#
# build           verify tag == pyproject == banto.__version__, test, uv build,
#                 twine check, CycloneDX SBOM, build-provenance attestation
# publish-pypi    PyPI Trusted Publishing (OIDC, PEP 740 attestations).
#                 Runs only when the repository variable
#                 PYPI_TRUSTED_PUBLISHING is "true" (set it after configuring
#                 the trusted publisher on pypi.org); otherwise it is skipped
#                 and the release can be uploaded manually.
# github-release  GitHub Release with wheel, sdist and SBOM.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"

      - name: Verify version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pyproject_version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          module_version=$(uv run --no-project python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('banto/__init__.py').read()).group(1))")
          echo "tag=$TAG pyproject=$pyproject_version module=$module_version"
          test "$TAG" = "v$pyproject_version"
          test "$pyproject_version" = "$module_version"

      - name: Test
        run: uv run --python 3.13 --with pytest --extra mcp pytest -q

      - name: Build
        run: uv build

      - name: twine check
        run: uvx twine check --strict dist/*

      - name: SBOM (CycloneDX)
        run: |
          uv venv -q /tmp/sbom-venv
          uv pip install -q -p /tmp/sbom-venv/bin/python dist/*.whl
          mkdir -p sbom
          uvx --from cyclonedx-bom cyclonedx-py environment \
            --pyproject pyproject.toml --output-format JSON \
            -o "sbom/banto-${GITHUB_REF_NAME#v}.cdx.json" /tmp/sbom-venv

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/banto/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  github-release:
    name: GitHub Release
    needs: [build, publish-pypi]
    if: ${{ always() && needs.build.result == 'success' && needs.publish-pypi.result != 'failure' && needs.publish-pypi.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -l artifacts/
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" artifacts/* --repo "$REPO" --verify-tag \
              --title "banto ${TAG#v}" \
              --notes "See [CHANGELOG.md](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.md) for details. Artifacts include the wheel, sdist and a CycloneDX SBOM; build provenance is attested (\`gh attestation verify <file> --repo ${REPO}\`)."
          fi
