name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: pytest
        run: uv run --python ${{ matrix.python-version }} --with pytest --extra mcp pytest

      - name: ruff
        run: uv run --python ${{ matrix.python-version }} --with ruff ruff check --select F,E9 .
